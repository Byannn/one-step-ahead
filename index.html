<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Step Ahead</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{height:100%;margin:0;background:#000}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#FFE3A3;
    font:600 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box;overflow:hidden}
  #stage{width:min(62vw,300px);height:auto;overflow:visible}
  h1{margin:0;font-size:24px;letter-spacing:.5px;color:#FFE3A3;opacity:0;transform:translateY(10px);animation:rise .5s ease-out 1.05s forwards}
  #msg{margin:0;max-width:300px;color:#D9DCF2;font-weight:500;opacity:0;animation:fade .5s ease-out 1.3s forwards}
  #bar{width:120px;height:4px;border-radius:4px;background:#1a1a1a;overflow:hidden;opacity:0;animation:fade .3s ease-out 1.2s forwards}
  #bar i{display:block;height:100%;width:0;background:#F0B33C;border-radius:4px;animation:load 1s ease-in-out 1.2s forwards}
  .actions{display:flex;flex-direction:column;gap:10px;align-items:center;opacity:0;animation:fade .5s ease-out 1.4s forwards}
  .standalone .actions,.standalone #msg{display:none}
  a#go{color:#000;background:#F0B33C;text-decoration:none;padding:12px 22px;border-radius:14px;font-weight:700;min-height:44px;box-sizing:border-box}
  #install[hidden]{display:none}
  #install{color:#FFE3A3;background:transparent;border:1px solid #F0B33C;padding:11px 20px;border-radius:14px;font:inherit;font-weight:700;min-height:44px}

  #hero{transform-box:fill-box;transform-origin:50% 100%;animation:drop .75s cubic-bezier(.3,1.5,.5,1) both, bob 2.4s ease-in-out 1s infinite}
  #eye{transform-box:fill-box;transform-origin:50% 50%;animation:wink .35s ease-in-out .9s 1}
  .tw{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:pop .45s ease-out forwards, twinkle 1.8s ease-in-out infinite}
  .tw:nth-child(1){animation-delay:.35s,.8s}
  .tw:nth-child(2){animation-delay:.45s,1.1s}
  .tw:nth-child(3){animation-delay:.55s,1.4s}
  .tw:nth-child(4){animation-delay:.65s,.95s}
  .tw:nth-child(5){animation-delay:.75s,1.25s}
  .dot{opacity:0;animation:fadeDot .25s ease-out forwards}
  .step{transform-box:fill-box;transform-origin:50% 50%;opacity:0;transform:scale(0);animation:stepin .3s cubic-bezier(.3,1.6,.5,1) forwards}
  .step:nth-child(1){animation-delay:.55s}
  .step:nth-child(2){animation-delay:.7s}
  .step:nth-child(3){animation-delay:.85s}
  .trail{stroke-dasharray:120;stroke-dashoffset:120;animation:draw .4s ease-out .6s forwards}

  @keyframes drop{0%{transform:translateY(-260px) rotate(-30deg) scale(.6);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(3deg)}}
  @keyframes wink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
  @keyframes pop{0%{opacity:0;transform:scale(0) rotate(-90deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
  @keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:1;transform:scale(.6)}}
  @keyframes stepin{to{opacity:1;transform:scale(1)}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes fade{to{opacity:1}}
  @keyframes fadeDot{to{opacity:.6}}
  @keyframes load{to{width:100%}}
  body.leave{animation:out .3s ease-in forwards}
  @keyframes out{to{opacity:0;transform:scale(1.04)}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}
  }
</style>
</head>
<body>
<svg id="stage" viewBox="60 60 900 900" role="img" aria-label="Wayfinder, maskot One Step Ahead">
  <g fill="#FFE3A3">
    <path class="tw" d="M210 250l14 36 36 14-36 14-14 36-14-36-36-14 36-14z"/>
    <path class="tw" d="M820 210l10 26 26 10-26 10-10 26-10-26-26-10 26-10z"/>
    <path class="tw" d="M842 700l12 30 30 12-30 12-12 30-12-30-30-12 30-12z"/>
    <path class="tw" d="M160 560l8 20 20 8-20 8-8 20-8-20-20-8 20-8z"/>
    <path class="tw" d="M700 120l7 17 17 7-17 7-7 17-7-17-17-7 17-7z"/>
  </g>
  <g fill="#FFFFFF">
    <circle class="dot" style="animation-delay:.3s" cx="330" cy="170" r="6"/>
    <circle class="dot" style="animation-delay:.5s" cx="590" cy="150" r="5"/>
    <circle class="dot" style="animation-delay:.6s" cx="900" cy="430" r="6"/>
    <circle class="dot" style="animation-delay:.4s" cx="120" cy="420" r="5"/>
    <circle class="dot" style="animation-delay:.7s" cx="760" cy="880" r="5"/>
  </g>
  <g fill="#F0B33C">
    <circle class="step" cx="248" cy="792" r="15" fill-opacity=".35"/>
    <circle class="step" cx="318" cy="742" r="19" fill-opacity=".5"/>
    <circle class="step" cx="396" cy="700" r="23" fill-opacity=".7"/>
  </g>
  <g stroke="#F0B33C" stroke-width="14" stroke-linecap="round" stroke-opacity=".55" fill="none">
    <path class="trail" d="M300 640q-40 -10 -70 -36"/>
    <path class="trail" d="M352 690q-36 4 -70 -10"/>
  </g>
  <g id="hero">
    <g transform="translate(540 470) rotate(-12) scale(10.6) translate(-32 -32)">
      <path d="M32 15L37.3 26.7L50.1 28.1L40.6 36.8L43.2 49.4L32 43L20.8 49.4L23.4 36.8L13.9 28.1L26.7 26.7Z" fill="#F0B33C" stroke="#F0B33C" stroke-width="5" stroke-linejoin="round"/>
      <path d="M32 17.5L36.4 27.4L47.2 28.6L39.2 35.9L41.4 46.5L32 41.1L22.6 46.5L24.8 35.9L16.8 28.6L27.6 27.4Z" fill="#F7C454"/>
      <ellipse cx="27" cy="25.5" rx="3.2" ry="1.6" transform="rotate(-30 27 25.5)" fill="#FFFFFF" opacity=".6"/>
      <circle cx="24.4" cy="37.4" r="1.9" fill="#FF8FA3" opacity=".55"/>
      <circle cx="39.6" cy="37.4" r="1.9" fill="#FF8FA3" opacity=".55"/>
      <ellipse id="eye" cx="28" cy="33.2" rx="1.75" ry="2.4" fill="#2A1C00"/>
      <path d="M34.2 33.6Q36 31.6 37.8 33.6" fill="none" stroke="#2A1C00" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M29 37.3Q32 41.2 35 37.3Z" fill="#2A1C00"/>
      <path d="M30.6 38.6Q32 39.9 33.4 38.6" fill="#FF8FA3"/>
    </g>
  </g>
</svg>
<h1>One Step Ahead</h1>
<div id="bar" aria-hidden="true"><i></i></div>
<p id="msg">Pasang halaman ini supaya ikon One Step Ahead muncul di layar utama.</p>
<div class="actions">
  <a id="go" href="https://claude.ai/artifact/2aPoWGmch6BX37gqm2asst">Buka One Step Ahead</a>
  <button id="install" type="button" hidden>Pasang sebagai aplikasi</button>
</div>
<script>
  var APP = "https://claude.ai/artifact/2aPoWGmch6BX37gqm2asst";
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  var standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var deferred = null, btn = document.getElementById("install"), msg = document.getElementById("msg");
  /* Dibuka dari ikon: animasi main sebentar, lalu masuk ke aplikasi. Ketuk layar untuk lewati. */
  if (standalone) {
    document.body.classList.add("standalone");
    var gone = false;
    var go = function () { if (gone) return; gone = true; document.body.classList.add("leave"); setTimeout(function () { location.replace(APP); }, reduce ? 0 : 280); };
    setTimeout(go, reduce ? 300 : 2300);
    addEventListener("pointerdown", go);
  }
  addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; btn.hidden = false; });
  btn.addEventListener("click", function () { if (!deferred) return; deferred.prompt(); deferred.userChoice.finally(function () { deferred = null; btn.hidden = true; }); });
  addEventListener("appinstalled", function () { msg.textContent = "Terpasang. Buka dari ikon One Step Ahead di layar utama."; btn.hidden = true; });
</script>
</body>
</html>
